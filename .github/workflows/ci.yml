name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run Python tests
        run: python -m pytest -q
      - name: Generate reliability report
        run: python tools/build_reliability_report.py --days 7 --output-dir reports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend syntax
        run: node --check app/static/app.js

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read application version
        id: app_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build container
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            -t "ai-security-intelligence-workbench:${APP_VERSION}" .
      - name: Start Compose stack
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: docker compose up -d
      - name: Verify container health
        id: health
        env:
          EXPECTED_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ai-security-intelligence-workbench 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          docker inspect --format='{{.State.Health.Status}}' ai-security-intelligence-workbench | grep -qx healthy
          curl -fsS http://127.0.0.1:8000/api/health | tee container-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.load(open("container-health.json", encoding="utf-8"))
          expected = os.environ["EXPECTED_VERSION"]
          assert payload["status"] == "ok", payload
          assert payload["version"] == expected, (payload, expected)
          output = Path("container-evidence")
          output.mkdir(parents=True, exist_ok=True)
          (output / "docker-validation.json").write_text(
              json.dumps({
                  "version": expected,
                  "docker_runtime_verified": True,
                  "image": f"ai-security-intelligence-workbench:{expected}",
                  "container_name": "ai-security-intelligence-workbench",
                  "health_response": payload,
                  "verified": True,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          docker compose ps
      - name: Capture container evidence
        if: always()
        run: |
          mkdir -p container-evidence
          docker compose ps > container-evidence/compose-ps.txt 2>&1 || true
          docker inspect ai-security-intelligence-workbench > container-evidence/container-inspect.json 2>&1 || true
          curl -fsS http://127.0.0.1:8000/api/health > container-evidence/health.json 2>&1 || true
          docker compose logs --no-color > container-evidence/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-health-evidence
          path: container-evidence
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release tags
        run: git fetch --force --tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create sentinel database
        run: |
          python - <<'PY'
          from app import storage

          storage.init_db()
          storage.upsert_event({
              "id": "CI-ROLLBACK-SENTINEL",
              "kind": "vulnerability",
              "status": "confirmed",
              "title": "Rollback validation sentinel",
          })
          PY
      - name: Run real rollback validation
        run: python tools/run_rollback_validation.py --host-port 18001
      - name: Publish rollback summary
        if: always()
        run: |
          if [ -f reports/rollback-validation.json ]; then
            cat reports/rollback-validation.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-validation
          path: reports/rollback-validation.json
